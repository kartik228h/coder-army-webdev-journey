<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>IIT-JEE registration form</legend>
    <form action="">
        <label for="name">Full Name</label>
        <input type="text" name="name" id="name" required>
        <br><br>
        <label for="mail">Email</label>
        <input type="text" name="mail" id="mail" required>
        <br><br>
        <label for="number">Phone</label>
        <input type="text" name="phone number" id="number" required>
        <br><br>
        <label>Gender</label>
        <input type="radio" name="gender" id="male" required>
        <label for="male">male</label>
        <input type="radio" name="gender" id="female" required>
        <label for="female">female</label>
        <input type="radio" name="gender" id="other" required>
        <label for="other">other</label>
        <br><br>
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" min="2005-01-01" max="2026-01-01"></fieldset>
        <br><br>
        <fieldset>
            <legend>USER other info</legend>
        <label for="school">School Name</label>
        <input type="text" name="school name" id="school">
        <br><br>
        <label for="b">Board</label>
        <select name="Board" id="b">
            <option value="" selected disabled>select your board</option>
            <option value="cbse">cbse</option>
            <option value="icse">icse</option>
            <option value="stae board">state board</option>
        </select>
        <br><br>
        <label for="passing">Year of Passing</label>
        <input type="number" name="year of passing" id="passing">
        <br><br>
        <label for="center">Exam_center</label>
        <select name="exam-center" id="center">
            <option  selected disabled>select center</option>
            <option value="delhi">delhi</option>
            <option value="noida">noida</option>
            <option value="gurugram">gurugram</option>
        </select>
        <br><br>
        <button>Register</button>
    </form></fieldset>
</body>
</html>
