<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Employee Details Form</h1>
    <form action="">
        <label for="f">Full name</label>
        <input type="text" name="name" id="f" required>
        <br><br>
        <label for="e">Email</label>
        <input type="text" name="email" id="e" required>
        <br><br>
        <label for="n">Phone number</label>
        <input type="text" name="number" id="n" required>
        <br><br>
        <label>Gender:</label>
        <input type="radio" name="Gender" id="male">
        <label for="male">male</label>
        <input type="radio" name="Gender" id="Female">
        <label for="Female">Female</label>
        <input type="radio" name="Gender" id="other">
        <label for="other">other</label>
        <br> <br>
        <label for="title">Job title</label>
        <input type="text" name="title" id="title">
        <br><br>
        <label for="dep">Department:</label>
        <select name="department" id="dep">
            <option value="" selected disabled>select your department</option>
        <option value="MECHANICAL">MECHANICAL</option>
        <option value="CSE">CSE</option>
        <option value="IT">IT</option>
        <option value="FINANCE">FINANCE</option>
        <option value="ELECTRIC">ELECTRIC</option>
        </select>
        <br><br>
        <button>submit</button>
    </form>
</body>
</html>
