<!DOCTYPE html> 
<!-- html ka fifth version us kar rha hu upar wali line yehi bta rahi hain -->
<html lang="en">
<!-- upar wali line bta rahi hai ki yaha se html ka code yaha se start ho rha hain  -->
<!-- lang="en" ye ye batata hain ki konsi language ka use karke lhikha gaya hain -->
<head>
    <meta charset="UTF-8">
    <!--"UTF-8" jab hamara data binary se character mein ya character se binary 
    mein convert hota hain toh wo ascii value nahi utf-8 ka use karta hain   -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--website ham laptop ke hisab se banate hain toh ye batata hain ki website phone mein kaise khulegi  -->
    <title>Document</title>
    <!-- website ke title ke liye hota hain ye -->
</head>
<body>
    <!-- jo bhi content hain usko yaha par likh sakte hain -->
</body>
</html>
<!-- uapr wali line ye bta rahi hain ki yaha par html ka code khatam hoga -->
